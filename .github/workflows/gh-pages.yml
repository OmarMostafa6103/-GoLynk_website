name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build
        run: npm run build

      - name: Show build output
        run: |
          echo "-- dist list --"
          ls -la dist || true
          echo "-- index.html head --"
          if [ -f dist/index.html ]; then head -n 40 dist/index.html; else echo 'dist/index.html not found'; fi

      - name: Create 404 fallback for SPA
        run: |
          if [ -f dist/index.html ]; then cp dist/index.html dist/404.html && echo 'Created dist/404.html as SPA fallback'; else echo 'dist/index.html not found, skipping 404 creation'; fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
